name: Make video
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script file in the scripts folder, e.g. mansa_musa.json
        required: true
      preview:
        description: "yes = quick small preview, no = full video + summary Short"
        required: false
        default: "no"
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SCRIPT: ${{ inputs.script }}
      PREVIEW: ${{ inputs.preview }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
    steps:
      - name: Get the engine
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Saved voice model and pictures
        uses: actions/cache@v4
        with:
          path: |
            models
            images-cache
            cache/voice
          key: engine-${{ github.run_id }}
          restore-keys: engine-
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install "rembg[cpu]" || pip install rembg || true
          mkdir -p images images-cache
          cp -n images-cache/* images/ 2>/dev/null || true
      - name: Unlock your files
        env:
          MEDIA_KEY: ${{ secrets.MEDIA_KEY }}
        run: python -u engine.py --unlock
      - name: Make video
        run: |
          if [ "$PREVIEW" = "yes" ]; then python -u engine.py "scripts/$SCRIPT" --preview; else python -u engine.py "scripts/$SCRIPT"; fi
      - name: Make shorts
        if: ${{ inputs.preview != 'yes' }}
        run: python -u engine.py --shorts "output/${SCRIPT%.json}" 1
      - name: Pack
        if: ${{ always() }}
        run: |
          rm -f output/*/narration.wav output/*/shorts/*.wav
          rm -rf voiceover/*.mp3 voiceover/*.m4a voiceover/*.wav clips_own/*.mp4 clips_own/*.mov clips_own/*.webm
          cp -u images/* images-cache/ 2>/dev/null || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: output/
          retention-days: 7
